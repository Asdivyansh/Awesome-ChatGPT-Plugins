<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Awesome ChatGPT Plugins</title>
  <desc id="desc">A curated list of plugins for ChatGPT and Codex</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10a37f"/>
      <stop offset="1" stop-color="#7cd4b8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>

  <!-- plugin tiles -->
  <g transform="translate(860 70)" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <g>
      <rect x="0" y="0" width="150" height="72" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="75" y="44" text-anchor="middle" font-size="24" fill="#e6edf3">🧩 Skills</text>
    </g>
    <g transform="translate(170 0)">
      <rect x="0" y="0" width="170" height="72" rx="16" fill="#10a37f" fill-opacity="0.18" stroke="#10a37f" stroke-opacity="0.6"/>
      <text x="85" y="44" text-anchor="middle" font-size="24" fill="#e6edf3">🔌 MCP Apps</text>
    </g>
    <g transform="translate(40 92)">
      <rect x="0" y="0" width="150" height="72" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="75" y="44" text-anchor="middle" font-size="24" fill="#e6edf3">🖼️ UI</text>
    </g>
    <g transform="translate(210 92)">
      <rect x="0" y="0" width="130" height="72" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="65" y="44" text-anchor="middle" font-size="24" fill="#e6edf3">⚡ Codex</text>
    </g>
    <g transform="translate(0 184)">
      <rect x="0" y="0" width="340" height="72" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#7cd4b8" stroke-opacity="0.35" stroke-dasharray="6 6"/>
      <text x="170" y="44" text-anchor="middle" font-size="22" fill="#9fb3c8">4,300+ plugins · 16 categories</text>
    </g>
  </g>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="30" font-weight="600" fill="url(#accent)" letter-spacing="2">AWESOME</text>
    <text x="70" y="222" font-size="68" font-weight="800" fill="#ffffff">ChatGPT Plugins</text>
    <text x="72" y="276" font-size="26" fill="#9fb3c8">The curated guide to plugins for ChatGPT &amp; Codex,</text>
    <text x="72" y="312" font-size="26" fill="#9fb3c8">plus everything you need to build your own.</text>
    <rect x="72" y="340" width="120" height="6" rx="3" fill="url(#accent)"/>
  </g>
</svg>
