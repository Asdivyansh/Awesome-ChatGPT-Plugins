name: Check links

on:
  pull_request:
    paths: ["**.md"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in curated docs
        uses: lycheeverse/lychee-action@v2
        with:
          # The generated catalog has thousands of chatgpt.com links behind bot protection,
          # so only the hand-written files are checked.
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,201,204,301,302,403,429
            --exclude "^https://chatgpt\\.com/"
            README.md CONTRIBUTING.md docs/*.md
          fail: true
